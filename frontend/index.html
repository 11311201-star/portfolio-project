<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的個人簡介</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 40px;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    .item {
      margin: 15px 0;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>個人簡介</h1>

    <div class="item">
      <strong>姓名：</strong>
      <span id="name">載入中...</span>
    </div>

    <div class="item">
      <strong>學校：</strong>
      <span id="school"></span>
    </div>

    <div class="item">
      <strong>科系：</strong>
      <span id="department"></span>
    </div>

    <div class="item">
      <strong>興趣：</strong>
      <span id="interests"></span>
    </div>
  </div>

  <script>
    fetch("http://localhost:3000/api/profile")
      .then(response => response.json())
      .then(data => {
        document.getElementById("name").textContent = data.name || "";
        document.getElementById("school").textContent = data.school || "";
        document.getElementById("department").textContent = data.department || "";
        document.getElementById("interests").textContent =
          (data.interests || []).join(", ");
      })
      .catch(error => {
        console.error("取得個人資料失敗：", error);
        document.getElementById("name").textContent = "資料載入失敗";
      });
  </script>

</body>
</html>
