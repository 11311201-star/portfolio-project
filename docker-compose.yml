services:
  frontend:
    build: ./frontend
    container_name: portfolio-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      
  backend:
    build: ./backend
    container_name: portfolio-backend
    ports:
      - "3000:3000"
    env_file:
    - .env  
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/portfolio
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0.43
    container_name: portfolio-mongodb
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
